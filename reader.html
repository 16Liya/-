<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>燕园伴读 - 北大文学教授</title>
    <style>
        :root {
            --pku-red: #8b0012;
            --pku-red-light: #a31525;
            --bg-color: #f7f3ed;
            --chat-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border: #e0e0e0;
            /* 动态视口高度，解决手机工具栏遮挡 */
            --full-height: 100dvh; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Serif SC", "Songti SC", serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            height: var(--full-height);
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* 顶部导航 */
        header {
            background-color: var(--pku-red); color: white; padding: env(safe-area-inset-top) 15px 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 100;
        }
        .logo { font-size: 1.1rem; font-weight: bold; letter-spacing: 1px; }
        .menu-toggle { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }

        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* 侧边栏 */
        .sidebar {
            position: absolute; left: -100%; top: 0; width: 85%; max-width: 320px; height: 100%;
            background: white; z-index: 200; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; gap: 15px;
        }
        .sidebar.active { transform: translateX(100%); }
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.4); z-index: 150; display: none; 
        }
        .overlay.active { display: block; }

        .section-title { font-size: 0.9rem; font-weight: bold; color: var(--pku-red); border-left: 3px solid var(--pku-red); padding-left: 8px; margin: 10px 0; }
        .input-box { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; margin-bottom: 5px; }
        .btn { padding: 12px; background: var(--pku-red); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .book-card { background: var(--bg-color); border-radius: 8px; padding: 12px; font-size: 0.85rem; border: 1px dashed var(--border); text-align: center; }

        /* 聊天区 */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }
        .chat-history { 
            flex: 1; padding: 15px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
            padding-bottom: 30px;
        }

        /* 消息气泡 */
        .message { display: flex; flex-direction: column; max-width: 90%; position: relative; }
        .msg-user { align-self: flex-end; }
        .msg-ai { align-self: flex-start; }

        .msg-info { font-size: 0.7rem; color: var(--text-sub); margin: 0 5px 4px 5px; display: flex; gap: 8px; }
        .msg-user .msg-info { justify-content: flex-end; }

        .bubble { 
            padding: 12px 15px; border-radius: 15px; font-size: 1rem; line-height: 1.5; 
            word-wrap: break-word; position: relative;
        }
        .msg-user .bubble { background: var(--pku-red); color: white; border-bottom-right-radius: 2px; }
        .msg-ai .bubble { background: var(--bg-color); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

        /* 消息操作菜单 */
        .msg-ops { 
            display: flex; gap: 10px; margin-top: 4px; opacity: 0.6; font-size: 0.75rem; 
            visibility: hidden;
        }
        .message:hover .msg-ops, .message:active .msg-ops { visibility: visible; }
        .op-btn { cursor: pointer; color: var(--text-sub); text-decoration: underline; }
        .op-btn:hover { color: var(--pku-red); }

        /* 输入框区域 */
        .input-panel {
            background: white; border-top: 1px solid var(--border);
            padding: 10px 15px calc(10px + env(safe-area-inset-bottom));
            display: flex; align-items: flex-end; gap: 10px;
        }
        .chat-input { 
            flex: 1; min-height: 40px; max-height: 120px; 
            padding: 10px 12px; border: 1px solid var(--border); border-radius: 20px;
            resize: none; font-size: 16px; outline: none; line-height: 1.4;
        }
        .chat-input:focus { border-color: var(--pku-red); }
        .send-btn { 
            width: 44px; height: 44px; background: var(--pku-red); color: white; 
            border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; transition: transform 0.1s;
        }
        .send-btn:active { transform: scale(0.9); }
        .send-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .loading-bar { 
            position: absolute; top: 0; left: 0; width: 0%; height: 3px; 
            background: var(--pku-red); transition: width 0.3s; z-index: 5;
        }

        #file-upload { display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">🏛️ 燕园伴读</div>
    <button class="menu-toggle" onclick="toggleSidebar(true)">资料/配置</button>
</header>

<div class="main-container">
    <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
    
    <aside class="sidebar" id="sidebar">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h2 style="color:var(--pku-red); font-size: 1.2rem;">配置面板</h2>
            <span onclick="toggleSidebar(false)" style="cursor:pointer; padding: 5px;">✕</span>
        </div>

        <div class="section-title">API 钥匙</div>
        <input type="password" class="input-box" id="api-key" placeholder="粘贴 Gemini API Key" onchange="saveConfig()">
        
        <div class="section-title">上传参考书 (TXT)</div>
        <button class="btn" style="background:#f3f3f3; color:#333; border: 1px solid #ccc;" onclick="document.getElementById('file-upload').click()">选择文件</button>
        <input type="file" id="file-upload" accept=".txt" onchange="handleFileUpload(event)">
        <div class="book-card" id="book-status">未加载书籍</div>

        <div class="section-title">教授设置</div>
        <select id="model-select" class="input-box">
            <option value="gemini-1.5-flash">Gemini 1.5 Flash (推荐：速度极快)</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro (更强：理解深厚)</option>
        </select>
        
        <div style="margin-top:auto; font-size: 0.75rem; color: var(--text-sub); line-height: 1.4;">
            * 注意：在国内使用需开启代理。<br>
            * 若API无反应，请检查Key权限。
        </div>
    </aside>

    <main class="chat-area">
        <div class="loading-bar" id="loading-bar"></div>
        <div class="chat-history" id="chat-history">
            <div class="message msg-ai">
                <div class="msg-info"><span>北大教授</span></div>
                <div class="bubble">同学你好。我是你的专业伴读。请在面板中配置好 Key 并上传书籍 TXT，我们可以开始深度研讨。</div>
            </div>
        </div>

        <div class="input-panel">
            <textarea class="chat-input" id="user-input" rows="1" placeholder="虚心求教..." oninput="autoResize(this)"></textarea>
            <button class="send-btn" onclick="sendMessage()" id="send-btn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </main>
</div>

<script>
    let currentBookText = "";
    let chatContext = [];

    // 初始化
    window.onload = () => {
        const key = localStorage.getItem('pku_ai_key');
        if (key) document.getElementById('api-key').value = key;
        
        // 自动调整输入框高度
        autoResize(document.getElementById('user-input'));
    };

    function toggleSidebar(show) {
        document.getElementById('sidebar').classList.toggle('active', show);
        document.getElementById('overlay').classList.toggle('active', show);
    }

    function saveConfig() {
        const key = document.getElementById('api-key').value.trim();
        localStorage.setItem('pku_ai_key', key);
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        const statusBox = document.getElementById('book-status');
        statusBox.innerText = "吸收知识中...";
        reader.onload = (e) => {
            currentBookText = e.target.result;
            statusBox.innerHTML = `已吸收：<br><b>《${file.name}》</b><br>(${(currentBookText.length/10000).toFixed(1)}万字)`;
            appendMessage('ai', `我已经通读了《${file.name}》，咱们可以针对此书的内容进行交流了。`);
            toggleSidebar(false);
        };
        reader.readAsText(file);
    }

    function appendMessage(role, text, id = Date.now()) {
        const history = document.getElementById('chat-history');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message msg-${role}`;
        msgDiv.id = `msg-${id}`;
        
        const info = role === 'user' ? '备考学生' : '北大教授';
        
        msgDiv.innerHTML = `
            <div class="msg-info"><span>${info}</span></div>
            <div class="bubble">${text}</div>
            <div class="msg-ops">
                <span class="op-btn" onclick="copyMsg('${id}')">复制</span>
                ${role === 'user' ? `<span class="op-btn" onclick="editMsg('${id}')">编辑</span>` : ''}
                <span class="op-btn" onclick="deleteMsg('${id}')">删除</span>
            </div>
        `;
        
        history.appendChild(msgDiv);
        history.scrollTop = history.scrollHeight;
        return id;
    }

    function deleteMsg(id) {
        document.getElementById(`msg-${id}`)?.remove();
        // 这里简单处理，不更新对话上下文数组，仅UI删除
    }

    function copyMsg(id) {
        const text = document.querySelector(`#msg-${id} .bubble`).innerText;
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        alert("已复制到剪贴板");
    }

    function editMsg(id) {
        const text = document.querySelector(`#msg-${id} .bubble`).innerText;
        document.getElementById('user-input').value = text;
        deleteMsg(id);
        document.getElementById('user-input').focus();
        autoResize(document.getElementById('user-input'));
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        const key = document.getElementById('api-key').value.trim();
        const model = document.getElementById('model-select').value;

        if (!text) return;
        if (!key) return alert("请先在面板配置 API Key");
        if (!currentBookText) return alert("请先上传书籍文本");

        const msgId = appendMessage('user', text);
        input.value = "";
        autoResize(input);

        // UI 状态
        const loader = document.getElementById('loading-bar');
        const sendBtn = document.getElementById('send-btn');
        loader.style.width = "30%";
        sendBtn.disabled = true;

        // 构建提示词
        const sysPrompt = `你是一位北京大学中文系教授。请严格根据以下书籍内容回答学生问题。
        若书中未提及，请直白告知。语气要严谨、提纲挈领。
        书籍全文如下：\n${currentBookText.substring(0, 800000)}`;

        chatContext.push({ role: "user", parts: [{ text: text }] });

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: sysPrompt }] },
                    contents: chatContext,
                    generationConfig: { temperature: 0.3 }
                })
            });

            loader.style.width = "80%";
            const data = await resp.json();

            if (data.error) {
                throw new Error(`${data.error.message} (${data.error.status})`);
            }

            const aiText = data.candidates[0].content.parts[0].text;
            appendMessage('ai', aiText);
            chatContext.push({ role: "model", parts: [{ text: aiText }] });

        } catch (err) {
            appendMessage('ai', `【教授断线了】原因：${err.message}\n建议：请检查是否开启了全局代理，或者 Key 是否有效。`);
        } finally {
            loader.style.width = "0%";
            sendBtn.disabled = false;
        }
    }
</script>
</body>
</html>

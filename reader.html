<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>燕园伴读 - 考研直连版</title>
    <style>
        :root {
            --pku-red: #8b0012;
            --bg-color: #f7f3ed;
            --chat-bg: #ffffff;
            --text-main: #2c3e50;
            --border: #e0e0e0;
            --vh: 1vh;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Serif SC", "Songti SC", serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            height: calc(var(--vh, 1vh) * 100);
            display: flex; flex-direction: column; overflow: hidden; 
        }

        header {
            background-color: var(--pku-red); color: white; 
            padding: env(safe-area-inset-top) 15px 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; flex-shrink: 0;
        }
        .config-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 15px; font-size: 0.8rem; }

        /* 全屏设置面板 */
        .config-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 1000; transform: translateY(-100%);
            transition: transform 0.3s ease;
            padding: 40px 20px; overflow-y: auto;
        }
        .config-panel.active { transform: translateY(0); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; padding: 10px; }

        .section-title { font-size: 0.9rem; font-weight: bold; color: var(--pku-red); margin: 20px 0 10px; border-left: 3px solid var(--pku-red); padding-left: 8px; }
        .input-box { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 10px; background: #fafafa; }
        .btn-action { width: 100%; padding: 14px; background: var(--pku-red); color: white; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }

        /* 聊天区 */
        .chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--chat-bg); position: relative; }
        .chat-history { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }

        .message { display: flex; flex-direction: column; max-width: 90%; }
        .msg-user { align-self: flex-end; }
        .msg-ai { align-self: flex-start; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 1rem; line-height: 1.6; word-break: break-all; }
        .msg-user .bubble { background: var(--pku-red); color: white; border-bottom-right-radius: 2px; }
        .msg-ai .bubble { background: var(--bg-color); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .msg-meta { font-size: 0.7rem; color: #999; margin-bottom: 4px; }

        /* 输入面板 */
        .input-panel {
            background: white; border-top: 1px solid var(--border);
            padding: 10px 15px calc(15px + env(safe-area-inset-bottom));
            display: flex; gap: 10px; align-items: flex-end;
        }
        .chat-input { flex: 1; min-height: 44px; max-height: 120px; padding: 10px 15px; border: 1px solid var(--border); border-radius: 22px; font-size: 16px; outline: none; resize: none; background: #f9f9f9; }
        .send-btn { width: 44px; height: 44px; background: var(--pku-red); color: white; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        #debug-log { font-family: monospace; font-size: 0.7rem; background: #1a1a1a; color: #0f0; padding: 12px; border-radius: 8px; margin-top: 10px; display: none; white-space: pre-wrap; word-break: break-all; }
        .loading-line { position: absolute; top: 0; left: 0; height: 3px; background: var(--pku-red); width: 0; transition: width 0.3s; }
    </style>
</head>
<body>

<header>
    <div class="logo">🏛️ 燕园伴读</div>
    <button class="config-btn" onclick="toggleConfig(true)">设置/排错</button>
</header>

<div class="config-panel" id="config-panel">
    <div class="close-btn" onclick="toggleConfig(false)">✕</div>
    <h2 style="color:var(--pku-red)">系统配置</h2>
    
    <div class="section-title">1. API 钥匙 (必填)</div>
    <input type="password" id="api-key" class="input-box" placeholder="在此粘贴你的 API Key">

    <div class="section-title">2. API 中转地址 (关键：解决连不上)</div>
    <input type="text" id="proxy-url" class="input-box" placeholder="默认已填入可用地址">
    <p style="font-size: 0.7rem; color: #e67e22;">如果你没翻墙，请使用默认的中转地址。</p>
    
    <button class="btn-action" style="background:#27ae60" onclick="testConnection()">⚡ 测试连接 (看到 Success 才能用)</button>
    <div id="debug-log"></div>

    <div class="section-title">3. 书籍上传 (TXT)</div>
    <input type="file" id="file-up" accept=".txt" style="display:none" onchange="onFile(event)">
    <button class="btn-action" style="background:#34495e" onclick="document.getElementById('file-up').click()">📂 加载专业课书籍</button>
    <div id="book-status" style="font-size:0.8rem; color:#666; text-align:center">当前无书籍</div>
</div>

<div class="chat-container">
    <div class="loading-line" id="loader"></div>
    <div class="chat-history" id="chat-history">
        <div class="message msg-ai">
            <div class="bubble">同学你好。如果 API 连不上，请点右上角设置，看看“测试连接”的反馈。</div>
        </div>
    </div>

    <div class="input-panel">
        <textarea id="user-in" class="chat-input" rows="1" placeholder="请教教授..." oninput="autoHeight(this)"></textarea>
        <button class="send-btn" onclick="doSend()">
            <svg style="width:20px;height:20px;fill:white" viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" /></svg>
        </button>
    </div>
</div>

<script>
    let bookContent = "";
    let chatMsgs = [];

    // 默认中转地址 (公益中转)
    const DEFAULT_PROXY = "https://api.geminiproxy.com"; // 如果这个挂了，我会再换一个

    window.onload = () => {
        setVH();
        document.getElementById('api-key').value = localStorage.getItem('pku_k') || '';
        document.getElementById('proxy-url').value = localStorage.getItem('pku_p') || DEFAULT_PROXY;
    };

    function setVH() { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); }
    window.addEventListener('resize', setVH);

    function toggleConfig(show) { document.getElementById('config-panel').classList.toggle('active', show); }
    
    function autoHeight(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

    function onFile(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            bookContent = ev.target.result;
            document.getElementById('book-status').innerHTML = `✅ 已加载: ${file.name}`;
            addMsg('ai', `书籍加载成功。现在可以开始学术讨论了。`);
            toggleConfig(false);
        };
        reader.readAsText(file);
    }

    function addMsg(role, text) {
        const h = document.getElementById('chat-history');
        const d = document.createElement('div');
        d.className = `message msg-${role}`;
        d.innerHTML = `<div class="msg-meta">${role==='user'?'学生':'教授'}</div><div class="bubble">${text}</div>`;
        h.appendChild(d);
        h.scrollTop = h.scrollHeight;
    }

    async function testConnection() {
        const k = document.getElementById('api-key').value.trim();
        const p = document.getElementById('proxy-url').value.trim();
        const log = document.getElementById('debug-log');
        log.style.display = 'block';
        log.innerText = `正在尝试通过中转站连接...\n中转: ${p}\n等待响应...`;
        localStorage.setItem('pku_k', k);
        localStorage.setItem('pku_p', p);

        try {
            const url = `${p.replace(/\/$/, '')}/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`;
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "hi" }] }] })
            });
            const data = await res.json();
            if(res.ok) {
                log.style.color = "#0f0";
                log.innerText += `\n\n✅ 成功！教授大脑已唤醒。\n测试回复: ${data.candidates[0].content.parts[0].text}`;
            } else {
                log.style.color = "#f00";
                log.innerText += `\n\n❌ 失败: ${data.error?.message || '未知错误'}`;
            }
        } catch (e) {
            log.style.color = "#f00";
            log.innerText += `\n\n🚨 彻底连接失败！\n报错: ${e.message}\n说明: 即使通过中转也无法访问。请尝试换一个中转地址或检查 Key。`;
        }
    }

    async function doSend() {
        const inEl = document.getElementById('user-in');
        const text = inEl.value.trim();
        const k = document.getElementById('api-key').value.trim();
        const p = document.getElementById('proxy-url').value.trim();

        if(!text || !k) return;
        if(!bookContent) return alert("请先加载书籍");

        addMsg('user', text);
        inEl.value = "";
        autoHeight(inEl);

        const ld = document.getElementById('loader');
        ld.style.width = "40%";

        const sysPrompt = `你是一位北大中文系教授。请严格根据以下书籍回答：\n${bookContent.substring(0, 500000)}`;
        chatMsgs.push({ role: "user", parts: [{ text: text }] });

        try {
            const res = await fetch(`${p.replace(/\/$/, '')}/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ systemInstruction: { parts: [{ text: sysPrompt }] }, contents: chatMsgs })
            });
            const data = await res.json();
            if(!res.ok) throw new Error(data.error?.message || "请求失败");

            const aiText = data.candidates[0].content.parts[0].text;
            addMsg('ai', aiText);
            chatMsgs.push({ role: "model", parts: [{ text: aiText }] });
        } catch (e) {
            addMsg('ai', `【教授失联】原因：${e.message}`);
        } finally {
            ld.style.width = "0";
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>燕园伴读 - 最终调试版</title>
    <style>
        :root {
            --pku-red: #8b0012;
            --pku-red-light: #a31525;
            --bg-color: #f7f3ed;
            --chat-bg: #ffffff;
            --text-main: #2c3e50;
            --border: #e0e0e0;
            --vh: 1vh; /* 兼容性高度变量 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Serif SC", "Songti SC", serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            height: calc(var(--vh, 1vh) * 100);
            display: flex; flex-direction: column; overflow: hidden; 
        }

        header {
            background-color: var(--pku-red); color: white; 
            padding: env(safe-area-inset-top) 15px 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; flex-shrink: 0;
        }
        .logo { font-size: 1.1rem; font-weight: bold; }
        .config-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; }

        /* 全屏配置遮罩 */
        .config-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 1000; transform: translateY(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 20px; overflow-y: auto;
        }
        .config-panel.active { transform: translateY(0); }
        .close-config { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: var(--text-main); }

        .section-title { font-size: 0.9rem; font-weight: bold; color: var(--pku-red); margin: 20px 0 10px; border-left: 3px solid var(--pku-red); padding-left: 8px; }
        .input-box { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; margin-bottom: 10px; }
        .btn-action { width: 100%; padding: 14px; background: var(--pku-red); color: white; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        
        /* 聊天区域 */
        .chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--chat-bg); position: relative; }
        .chat-history { 
            flex: 1; padding: 15px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 15px;
            padding-bottom: 50px;
        }

        /* 消息气泡 */
        .message { display: flex; flex-direction: column; max-width: 90%; }
        .msg-user { align-self: flex-end; }
        .msg-ai { align-self: flex-start; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 1rem; line-height: 1.6; word-break: break-all; }
        .msg-user .bubble { background: var(--pku-red); color: white; border-bottom-right-radius: 2px; }
        .msg-ai .bubble { background: var(--bg-color); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .msg-meta { font-size: 0.7rem; color: #999; margin: 4px 6px; }

        /* 输入面板 */
        .input-panel {
            background: white; border-top: 1px solid var(--border);
            padding: 10px 15px calc(15px + env(safe-area-inset-bottom));
            display: flex; gap: 10px; align-items: flex-end;
        }
        .chat-input { 
            flex: 1; min-height: 44px; max-height: 120px; 
            padding: 10px 15px; border: 1px solid var(--border); border-radius: 22px;
            font-size: 16px; outline: none; resize: none;
        }
        .send-btn { 
            width: 44px; height: 44px; background: var(--pku-red); color: white; 
            border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        .loading-line { position: absolute; top: 0; left: 0; height: 3px; background: var(--pku-red); width: 0; transition: width 0.3s; }
        
        /* 调试日志样式 */
        .debug-info { font-family: monospace; font-size: 0.7rem; background: #000; color: #0f0; padding: 10px; border-radius: 5px; margin-top: 10px; display: none; white-space: pre-wrap;}
    </style>
</head>
<body>

<header>
    <div class="logo">🏛️ 燕园伴读</div>
    <button class="config-btn" onclick="toggleConfig(true)">设置/书籍</button>
</header>

<div class="config-panel" id="config-panel">
    <div class="close-config" onclick="toggleConfig(false)">✕</div>
    <h2 style="color:var(--pku-red)">系统配置</h2>
    
    <div class="section-title">1. API 密钥 (必填)</div>
    <input type="password" id="api-key" class="input-box" placeholder="输入 Gemini API Key" onchange="saveConfig()">
    <button class="btn-action" style="background:#2ecc71" onclick="testConnection()">⚡ 测试连接 (点击排查问题)</button>
    <div id="debug-log" class="debug-info"></div>

    <div class="section-title">2. 阅读书籍 (TXT)</div>
    <input type="file" id="file-upload" accept=".txt" style="display:none" onchange="handleFile(event)">
    <button class="btn-action" style="background:#34495e" onclick="document.getElementById('file-upload').click()">📂 选择书籍文件</button>
    <div id="book-info" style="font-size:0.8rem; color:#666; text-align:center">当前无书籍</div>

    <div class="section-title">3. 模型选择</div>
    <select id="model-select" class="input-box">
        <option value="gemini-1.5-flash">Gemini 1.5 Flash (极速推荐)</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro (逻辑更强)</option>
    </select>
    
    <p style="margin-top:30px; font-size:0.75rem; color:#999; line-height:1.5">
        排查指南：<br>
        1. 确保手机处于“科学上网”全局模式。<br>
        2. 点击上方“测试连接”，若返回 200 则正常。<br>
        3. 若报错 403，请检查 Key 是否填写正确。
    </p>
</div>

<div class="chat-container">
    <div class="loading-line" id="loader"></div>
    <div class="chat-history" id="chat-history">
        <div class="message msg-ai">
            <div class="bubble">欢迎，备考路上的战友。请先点击右上角“设置”进行初始化。</div>
        </div>
    </div>

    <div class="input-panel">
        <textarea id="user-input" class="chat-input" rows="1" placeholder="虚心请教..." oninput="autoHeight(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="send()">
            <svg style="width:20px;height:20px;fill:white" viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" /></svg>
        </button>
    </div>
</div>

<script>
    let bookContent = "";
    let context = [];

    // 解决移动端浏览器高度抖动
    function setVH() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    window.addEventListener('resize', setVH);
    setVH();

    window.onload = () => {
        const k = localStorage.getItem('pku_key');
        if(k) document.getElementById('api-key').value = k;
    };

    function toggleConfig(show) {
        document.getElementById('config-panel').classList.toggle('active', show);
    }

    function saveConfig() {
        localStorage.setItem('pku_key', document.getElementById('api-key').value.trim());
    }

    function autoHeight(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            bookContent = ev.target.result;
            document.getElementById('book-info').innerText = `✅ 已加载: ${file.name} (${Math.round(bookContent.length/10000)}万字)`;
            addMsg('ai', `教授已通读《${file.name}》，可以开始提问了。`);
            toggleConfig(false);
        };
        reader.readAsText(file);
    }

    function addMsg(role, text) {
        const h = document.getElementById('chat-history');
        const d = document.createElement('div');
        d.className = `message msg-${role}`;
        d.innerHTML = `<div class="msg-meta">${role==='user'?'学生':'教授'}</div><div class="bubble">${text}</div>`;
        h.appendChild(d);
        h.scrollTop = h.scrollHeight;
    }

    // --- 核心调试功能 ---
    async function testConnection() {
        const key = document.getElementById('api-key').value.trim();
        const log = document.getElementById('debug-log');
        log.style.display = 'block';
        log.innerText = "正在发起测试请求...\n目标: googleapis.com";

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "hi" }] }] })
            });
            const data = await res.json();
            if(res.ok) {
                log.innerText += `\n✅ 连接成功！状态码: ${res.status}\n响应: ${data.candidates[0].content.parts[0].text}`;
            } else {
                log.style.color = "#ff4757";
                log.innerText += `\n❌ 失败！状态码: ${res.status}\n原因: ${data.error.message}`;
            }
        } catch (e) {
            log.style.color = "#ff4757";
            log.innerText += `\n🚨 网络异常！无法访问服务器。\n排查提示：请确认是否已经“翻墙”并开启了全局代理。`;
        }
    }

    async function send() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        const key = document.getElementById('api-key').value.trim();
        const model = document.getElementById('model-select').value;

        if(!text || !key) return alert("请检查内容和 Key");
        if(!bookContent) return alert("请先上传书籍文本");

        addMsg('user', text);
        input.value = "";
        input.style.height = '44px';

        const loader = document.getElementById('loader');
        loader.style.width = "40%";

        const sys = `你是一位北大中文系教授。严格根据此书回答：\n${bookContent.substring(0, 500000)}`;
        context.push({ role: "user", parts: [{ text: text }] });

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: sys }] },
                    contents: context
                })
            });
            
            loader.style.width = "80%";
            const data = await res.json();
            if(data.error) throw new Error(data.error.message);

            const aiText = data.candidates[0].content.parts[0].text;
            addMsg('ai', aiText);
            context.push({ role: "model", parts: [{ text: aiText }] });
        } catch (e) {
            addMsg('ai', `【连接中断】${e.message}\n请检查网络环境或点击“设置”进行连接测试。`);
        } finally {
            loader.style.width = "0";
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>燕园伴读 - 经典对话</title>
    <style>
        :root {
            --pku-red: #8b0012;
            --bg-color: #f5f5f5;
            --user-bubble: #95ec69; /* 经典的绿色气泡 */
            --ai-bubble: #ffffff;
            --text-main: #191919;
            --border-color: #e7e7e7;
            --vh: 1vh;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            height: calc(var(--vh, 1vh) * 100);
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* 顶部导航 */
        header {
            background-color: #ededed; color: var(--text-main); 
            padding: env(safe-area-inset-top) 15px 10px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); z-index: 100;
        }
        .header-title { font-size: 1rem; font-weight: 500; }
        .config-icon { font-size: 1.2rem; cursor: pointer; padding: 5px; }

        /* 配置抽屉 */
        .drawer {
            position: fixed; top: 0; right: 0; width: 85%; height: 100%;
            background: #fff; z-index: 1001; transform: translateX(100%);
            transition: transform 0.3s ease; padding: 25px 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
        }
        .drawer.active { transform: translateX(0); }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; display: none; }
        .drawer-overlay.active { display: block; }

        .drawer h3 { margin-bottom: 15px; font-size: 1.1rem; color: var(--pku-red); border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .label { font-size: 0.85rem; color: #666; margin-bottom: 5px; display: block; }
        .input-item { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        .btn-save { width: 100%; padding: 12px; background: var(--pku-red); color: white; border: none; border-radius: 6px; font-weight: bold; }

        /* 聊天区域 */
        .chat-main { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }

        .msg-row { display: flex; width: 100%; position: relative; }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.ai { justify-content: flex-start; }

        .avatar { width: 40px; height: 40px; border-radius: 4px; background-size: cover; flex-shrink: 0; }
        .ai .avatar { background-color: var(--pku-red); margin-right: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem; font-weight: bold; }
        .user .avatar { background-color: #ddd; margin-left: 10px; }

        .bubble-wrap { max-width: 70%; position: relative; }
        .bubble { 
            padding: 10px 12px; border-radius: 6px; font-size: 1rem; line-height: 1.5; 
            position: relative; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .ai .bubble { background: var(--ai-bubble); color: #000; border: 1px solid #e0e0e0; }
        .user .bubble { background: var(--user-bubble); color: #000; }

        /* 气泡小箭头 */
        .bubble::after { content: ""; position: absolute; top: 12px; width: 0; height: 0; border: 6px solid transparent; }
        .ai .bubble::after { left: -12px; border-right-color: var(--ai-bubble); }
        .user .bubble::after { right: -12px; border-left-color: var(--user-bubble); }

        /* 交互菜单 */
        .msg-actions { 
            position: absolute; bottom: -25px; display: none; gap: 10px; font-size: 0.75rem; color: #888; 
            background: rgba(255,255,255,0.9); padding: 2px 8px; border-radius: 10px; border: 1px solid #eee;
        }
        .msg-row:active .msg-actions, .msg-row.show-menu .msg-actions { display: flex; }
        .action-item { cursor: pointer; }
        .action-item:hover { color: var(--pku-red); }

        /* 输入栏 */
        .footer { 
            background: #f7f7f7; border-top: 1px solid var(--border-color);
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
            display: flex; align-items: flex-end; gap: 8px;
        }
        .input-area { 
            flex: 1; background: white; border: 1px solid #ddd; border-radius: 6px;
            padding: 8px 12px; min-height: 38px; max-height: 120px; 
            font-size: 16px; outline: none; resize: none; line-height: 1.4;
        }
        .btn-send { 
            width: 60px; height: 38px; background: #07c160; color: white; 
            border: none; border-radius: 4px; font-weight: 500; font-size: 0.9rem;
        }
        .btn-send:disabled { opacity: 0.5; }

        .loading-dots { font-size: 0.8rem; color: #999; margin-left: 50px; display: none; }
    </style>
</head>
<body>

<header>
    <div style="width: 30px;"></div> <!-- 占位平衡 -->
    <div class="header-title">燕园伴读 (北大教授)</div>
    <div class="config-icon" onclick="toggleDrawer(true)">⚙️</div>
</header>

<div class="drawer-overlay" id="overlay" onclick="toggleDrawer(false)"></div>
<div class="drawer" id="drawer">
    <h3>系统设置</h3>
    <label class="label">API Key</label>
    <input type="password" id="api-key" class="input-item" placeholder="中转 API Key">
    
    <label class="label">接口地址 (中转站提供)</label>
    <input type="text" id="proxy-url" class="input-item" placeholder="例如: https://api.xxx.com">
    
    <label class="label">上传书籍 (TXT)</label>
    <input type="file" id="file-input" accept=".txt" style="display:none" onchange="handleFile(event)">
    <button class="input-item" style="background:#f0f0f0; border:1px dashed #ccc;" onclick="document.getElementById('file-input').click()">点击选择书籍</button>
    <div id="book-info" style="font-size:12px; color:#999; text-align:center;">尚未加载资料</div>
    
    <button class="btn-save" style="margin-top:20px" onclick="saveSettings()">保存配置并关闭</button>
</div>

<main class="chat-main" id="chat-content">
    <div class="msg-row ai">
        <div class="avatar">PKU</div>
        <div class="bubble-wrap">
            <div class="bubble">同学你好。我是负责辅导你专业课的教授。请加载书籍资料并配置好 API，我们可以开始研讨。</div>
        </div>
    </div>
</main>

<div class="loading-dots" id="loading-hint">教授正在组织语言...</div>

<div class="footer">
    <textarea class="input-area" id="user-input" rows="1" placeholder="虚心求教..." oninput="reSize(this)"></textarea>
    <button class="btn-send" id="send-btn" onclick="handleSend()">发送</button>
</div>

<script>
    let bookData = "";
    let messageLog = [];

    // 初始化动态高度
    function setVH() { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); }
    window.addEventListener('resize', setVH);
    setVH();

    window.onload = () => {
        document.getElementById('api-key').value = localStorage.getItem('chat_key') || '';
        document.getElementById('proxy-url').value = localStorage.getItem('chat_proxy') || 'https://generativelanguage.googleapis.com';
    };

    function toggleDrawer(show) {
        document.getElementById('drawer').classList.toggle('active', show);
        document.getElementById('overlay').classList.toggle('active', show);
    }

    function saveSettings() {
        localStorage.setItem('chat_key', document.getElementById('api-key').value.trim());
        localStorage.setItem('chat_proxy', document.getElementById('proxy-url').value.trim());
        toggleDrawer(false);
    }

    function reSize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            bookData = ev.target.result;
            document.getElementById('book-info').innerText = `✅ 已加载: ${file.name}`;
            renderMsg('ai', `书籍《${file.name}》已载入。我已准备好为你答疑解惑。`);
            toggleDrawer(false);
        };
        reader.readAsText(file);
    }

    function renderMsg(role, text) {
        const container = document.getElementById('chat-content');
        const row = document.createElement('div');
        const id = 'msg_' + Date.now();
        row.className = `msg-row ${role}`;
        row.id = id;
        
        // 点击显示菜单
        row.onclick = () => {
            document.querySelectorAll('.msg-row').forEach(r => r.classList.remove('show-menu'));
            row.classList.toggle('show-menu');
        };

        row.innerHTML = `
            ${role==='ai' ? '<div class="avatar">PKU</div>' : ''}
            <div class="bubble-wrap">
                <div class="bubble">${text}</div>
                <div class="msg-actions">
                    <span class="action-item" onclick="copyText('${id}')">复制</span>
                    <span class="action-item" onclick="deleteText('${id}')">删除</span>
                    ${role==='user' ? `<span class="action-item" onclick="editText('${id}')">重说</span>` : ''}
                </div>
            </div>
            ${role==='user' ? '<div class="avatar"></div>' : ''}
        `;
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
        return id;
    }

    function deleteText(id) { document.getElementById(id).remove(); }
    function copyText(id) {
        const t = document.querySelector(`#${id} .bubble`).innerText;
        navigator.clipboard.writeText(t).then(() => alert("已复制"));
    }
    function editText(id) {
        const t = document.querySelector(`#${id} .bubble`).innerText;
        document.getElementById('user-input').value = t;
        deleteText(id);
        reSize(document.getElementById('user-input'));
        document.getElementById('user-input').focus();
    }

    async function handleSend() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        const key = document.getElementById('api-key').value.trim();
        const proxy = document.getElementById('proxy-url').value.trim() || 'https://generativelanguage.googleapis.com';

        if(!text || !key) return alert("请检查输入或 API 设置");
        if(!bookData) return alert("请先上传书籍文本");

        renderMsg('user', text);
        input.value = "";
        reSize(input);

        const hint = document.getElementById('loading-hint');
        const btn = document.getElementById('send-btn');
        hint.style.display = 'block';
        btn.disabled = true;

        const systemContent = `你是一位北大中文系教授。请严格根据以下书籍内容回答学生提问：\n${bookData.substring(0, 500000)}`;
        messageLog.push({ role: "user", parts: [{ text: text }] });

        try {
            const baseUrl = proxy.replace(/\/$/, '');
            const response = await fetch(`${baseUrl}/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: systemContent }] },
                    contents: messageLog
                })
            });

            const result = await response.json();
            if(!response.ok) throw new Error(result.error?.message || "请求失败");

            const aiText = result.candidates[0].content.parts[0].text;
            renderMsg('ai', aiText);
            messageLog.push({ role: "model", parts: [{ text: aiText }] });

        } catch (err) {
            renderMsg('ai', `【教授断线】${err.message}\n请检查 API Key 是否有效，或中转地址是否填写正确。`);
        } finally {
            hint.style.display = 'none';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>文学史伴读 - 第一章</title>
    <style>
        :root {
            --pku-red: #8b0012;
            --pixel-bg: #fdf6e3;
            --pixel-border: #5d4037;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            background-color: var(--pixel-bg); 
            font-family: "Courier New", Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            overflow: hidden;
            color: var(--pixel-border);
        }

        /* 像素头图区 */
        .hero {
            background: #e6dec5;
            border-bottom: 4px solid var(--pixel-border);
            padding: 20px 10px;
            text-align: center;
            position: relative;
        }

        /* 简单的像素小人 SVG */
        .avatar {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            image-rendering: pixelated;
        }

        .bubble {
            background: white;
            border: 2px solid var(--pixel-border);
            border-radius: 10px;
            padding: 5px 10px;
            display: inline-block;
            font-size: 12px;
            position: relative;
            margin-bottom: 5px;
        }

        /* 列表容器 */
        #display-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 120px;
        }

        /* 知识卡片 - 像素风格 */
        .card {
            background: white;
            border: 3px solid var(--pixel-border);
            padding: 15px;
            position: relative;
            box-shadow: 4px 4px 0px var(--pixel-border);
            line-height: 1.6;
        }
        
        .card::before {
            content: "◆";
            position: absolute;
            left: -10px;
            top: 10px;
            background: var(--pixel-bg);
            padding: 0 2px;
        }

        .card-tag {
            font-size: 11px;
            background: var(--pku-red);
            color: white;
            padding: 2px 6px;
            display: inline-block;
            margin-bottom: 8px;
        }

        /* 搜索栏 - 悬浮在底部 */
        .search-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #e6dec5;
            border-top: 4px solid var(--pixel-border);
            padding: 15px 15px calc(env(safe-area-inset-bottom) + 15px);
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            border: 3px solid var(--pixel-border);
            padding: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        button {
            background: var(--pku-red);
            color: white;
            border: 3px solid var(--pixel-border);
            padding: 0 15px;
            font-weight: bold;
            box-shadow: 2px 2px 0px #333;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #333;
        }

        mark { background: #ffeb3b; color: black; }

        .hint-btns {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin-top: 10px;
            padding-bottom: 5px;
        }
        .hint-tag {
            font-size: 10px;
            background: #d3c6a3;
            padding: 3px 8px;
            border: 1px solid var(--pixel-border);
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="avatar">
        <!-- 一个简单的像素小人图标 -->
        <svg viewBox="0 0 8 8" fill="currentColor">
            <path d="M3 0h2v1H3zM2 1h4v1H2zM1 2h6v3H1zM2 5h4v1H2zM3 6h2v2H3z" />
        </svg>
    </div>
    <div class="bubble" id="npc-talk">你好！我是第一章的助教。想找什么？</div>
    <div class="hint-btns">
        <div class="hint-tag" onclick="quickSearch('文学革命')">#文学革命</div>
        <div class="hint-tag" onclick="quickSearch('鲁迅')">#鲁迅</div>
        <div class="hint-tag" onclick="quickSearch('浪漫主义')">#浪漫主义</div>
        <div class="hint-tag" onclick="quickSearch('女神')">#郭沫若</div>
    </div>
</div>

<div id="display-area">
    <div class="card">
        <div class="card-tag">说明</div>
        内容已根据《现代文学史》第一章内置。请在下方输入关键词检索。
    </div>
</div>

<div class="search-container">
    <input type="text" id="search-input" placeholder="输入关键词...">
    <button onclick="handleSearch()">搜索</button>
</div>

<script>
    // --- 内置的第一章知识库 (根据你提供的Word内容精炼) ---
    const CHAPTER_DATA = [
        {
            tag: "核心定义",
            content: "1917年初发生的文学革命，在中国文学史上树起一个鲜明的界碑，标示着古典文学的结束，现代文学的起始。"
        },
        {
            tag: "背景",
            content: "文学革命的爆发有其历史背景，在相当程度上利用了晚清以来文学变革的态势与思想资源，如‘诗界革命’、‘小说界革命’等。"
        },
        {
            tag: "时代性格",
            content: "充分自由发展是‘五四’时期一种突出的文学时代性格。创作给人以活跃、单纯、亲切的感觉，追求文学个性化。"
        },
        {
            tag: "主流方法",
            content: "现实主义成为‘五四’时期最有实力的创作方法。鲁迅小说创作的极大成功，将现实主义提高到与世界文学对话的高水平。"
        },
        {
            tag: "多元并存",
            content: "‘五四’时期并不存在现实主义独尊，浪漫主义也极受青睐。各种文体充溢着强烈的主观情绪与抒情色彩。"
        },
        {
            tag: "代表作品",
            content: "郭沫若以《女神》为代表的自由体诗，充盈着浪漫主义色彩；湖畔诗人的爱情诗，以及冰心、宗白华的哲理小诗。"
        },
        {
            tag: "局限性",
            content: "早期新文学作品内容仍比较狭窄，题材、情节、形象有许多类似和重复，年轻作家还来不及融汇吸收外来和传统写法。"
        },
        {
            tag: "创作群体",
            content: "文学研究会、创造社等社团的成立，推动了文学思潮的多元发展。文学研究会主张‘为人生的文学’。"
        }
    ];

    const displayArea = document.getElementById('display-area');
    const npcTalk = document.getElementById('npc-talk');

    function quickSearch(val) {
        document.getElementById('search-input').value = val;
        handleSearch();
    }

    function handleSearch() {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return;

        // 检索逻辑
        const results = CHAPTER_DATA.filter(item => 
            item.content.includes(query) || item.tag.includes(query)
        );

        if (results.length > 0) {
            npcTalk.innerText = `找到了 ${results.length} 条关于“${query}”的知识点！`;
            // 渲染结果
            displayArea.innerHTML = "";
            results.forEach(res => {
                const card = document.createElement('div');
                card.className = 'card';
                // 关键词高亮
                const highlighted = res.content.split(query).join(`<mark>${query}</mark>`);
                card.innerHTML = `
                    <div class="card-tag">${res.tag}</div>
                    <div>${highlighted}</div>
                `;
                displayArea.appendChild(card);
            });
        } else {
            npcTalk.innerText = `抱歉，第一章里好像没提到“${query}”...`;
            const empty = document.createElement('div');
            empty.className = 'card';
            empty.innerText = "未找到结果，试试 鲁迅、现实主义 或 女神。";
            displayArea.prepend(empty);
        }
        
        document.getElementById('search-input').value = "";
    }

    // 回车搜索
    document.getElementById('search-input').onkeypress = (e) => {
        if(e.key === 'Enter') handleSearch();
    }
</script>

</body>
</html>
